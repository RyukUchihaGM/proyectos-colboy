<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Store - Contacto</title>
    <link rel="stylesheet" type="text/css" href="css/estilo.css">
</head>
<body>

<header>
    <nav>
        <h2>Mobile<span>Store</span></h2>

        <div class="menu">
            <a href="index.html">Inicio</a>
            <a href="marcas.html">Marcas</a>
            <a href="productos.html">Productos</a>
            <a href="encuesta.html">Encuesta</a>
            <a href="contacto.html" class="active">Contacto</a>
        </div>

        <button onclick="location.href='productos.html'">Comprar ahora</button>
    </nav>
</header>

<main>
    <section class="section">
        <div class="title">
            <small>ESTAMOS PARA AYUDARTE</small>
            <h2>Ponte en contacto</h2>
        </div>

        <form class="contact-form">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tu@email.com" required>

            <label for="asunto">Asunto</label>
            <select id="asunto">
                <option value="consulta">Consulta general</option>
                <option value="soporte">Soporte técnico</option>
                <option value="ventas">Información de compras</option>
            </select>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" rows="4" placeholder="¿En qué te podemos ayudar?" required></textarea>

            <button type="submit">Enviar mensaje</button>
        </form>
    </section>
</main>

<footer>
    <h2>Mobile<span>Store</span></h2>
    <p>La tecnología que quieres, al mejor precio.</p>
    <small>© 2026 Mobile Store. Todos los derechos reservados.</small>
</footer>

</body>
</html>
